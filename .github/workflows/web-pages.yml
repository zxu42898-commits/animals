name: Publish mobile web app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'desktop/server.cjs'
      - 'package*.json'
      - 'index.html'
      - 'vite.config.js'
      - '.github/workflows/web-pages.yml'
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy HTTPS website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check published page and assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module - <<'JS'
          const base = process.env.SITE_URL;
          if (!base?.startsWith('https://')) throw new Error('Missing HTTPS deployment URL');
          let html;
          for (let attempt = 0; attempt < 6; attempt++) {
            const response = await fetch(base, { cache: 'no-store' });
            if (response.ok) { html = await response.text(); break; }
            if (attempt === 5) throw new Error(`Website returned HTTP ${response.status}`);
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          if (!html.includes('森野识物') || !html.includes('id="app"')) throw new Error('Unexpected deployed page');
          const assets = [...html.matchAll(/(?:src|href)="([^"\s]+\.(?:js|css))"/g)].map(match => new URL(match[1], base));
          if (assets.length < 2) throw new Error('Missing app script or stylesheet');
          for (const asset of assets) {
            const response = await fetch(asset);
            if (!response.ok) throw new Error(`${asset} returned HTTP ${response.status}`);
            console.log(`Verified asset: ${asset}`);
          }
          console.log(`Verified HTTPS website: ${base}`);
          JS
