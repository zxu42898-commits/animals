name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'desktop/**'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'package*.json'
      - 'electron-builder.yml'
      - '.github/workflows/windows-desktop.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:camera
      - run: npm run test:recognition
      - run: npm run desktop:package
      - run: node scripts/desktop-camera-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recognition-test-results
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: AnimalLens-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 90
